---
- name: Installer et configurer Node Exporter sur les noeuds
  hosts: managed_nodes
  become: yes
  vars:
    node_exporter_version: "1.8.2"

  tasks:
    - name: Télécharger l'archive Node Exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz

    - name: Extraire l'archive
      ansible.builtin.unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Copier le binaire dans /usr/local/bin
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        mode: '0755'
        remote_src: yes

    - name: "Créer un utilisateur système dédié (sécurité: pas root)"
      ansible.builtin.user:
        name: node_exporter
        system: yes
        shell: /usr/sbin/nologin

    - name: Créer le service systemd
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target
      notify: Redémarrer node_exporter

    - name: Démarrer et activer le service au boot
      ansible.builtin.systemd:
        name: node_exporter
        state: started
        enabled: yes
        daemon_reload: yes

  handlers:
    - name: Redémarrer node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
